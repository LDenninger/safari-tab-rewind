<svg xmlns="http://www.w3.org/2000/svg" width="328" height="78" viewBox="0 0 328 78" role="img" aria-labelledby="title">
  <title id="title">TabRewind</title>
  <style>
    .tab { fill: #2463c7; }
    .rewind { fill: #7545c5; }
    @media (prefers-color-scheme: dark) {
      .tab { fill: #77a8ff; }
      .rewind { fill: #b89bff; }
    }
  </style>
  <text x="2" y="59" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="64" font-weight="700" letter-spacing="-2.5"><tspan class="tab">Tab</tspan><tspan class="rewind">Rewind</tspan></text>
</svg>
