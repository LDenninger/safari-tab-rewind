<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">TabRewind app icon</title>
  <desc id="description">A white circular rewind arrow with an orange accent on a blue compass dial and silver-white tile.</desc>

  <defs>
    <linearGradient id="tile" x2="0" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset=".48" stop-color="#f8fbff"/>
      <stop offset=".84" stop-color="#e5ebf4"/>
      <stop offset="1" stop-color="#f3f6fb"/>
    </linearGradient>
    <linearGradient id="tile-edge" x2="0" y2="1">
      <stop stop-color="#b9c1ce"/>
      <stop offset=".27" stop-color="#fdfdff"/>
      <stop offset=".78" stop-color="#dbe2ec"/>
      <stop offset="1" stop-color="#a7b2c2"/>
    </linearGradient>
    <linearGradient id="dial" x1=".28" y1="0" x2=".67" y2="1">
      <stop stop-color="#04d0f6"/>
      <stop offset=".34" stop-color="#02aafa"/>
      <stop offset=".72" stop-color="#0585f9"/>
      <stop offset="1" stop-color="#0862ef"/>
    </linearGradient>
    <linearGradient id="dial-edge" x2="0" y2="1">
      <stop stop-color="#7aeeff"/>
      <stop offset=".43" stop-color="#16c0fc"/>
      <stop offset="1" stop-color="#0576f7"/>
    </linearGradient>
    <radialGradient id="pivot" cx=".34" cy=".22" r=".84">
      <stop stop-color="#ffb064"/>
      <stop offset=".42" stop-color="#ff702a"/>
      <stop offset="1" stop-color="#fa3414"/>
    </radialGradient>
    <filter id="tile-shadow" x="-.1" y="-.1" width="1.2" height="1.25" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#203756" flood-opacity=".22"/>
    </filter>
    <filter id="dial-shadow" x="-.15" y="-.15" width="1.3" height="1.35" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#3366ac" flood-opacity=".3"/>
    </filter>
    <filter id="arrow-shadow" x="-.2" y="-.2" width="1.4" height="1.5" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#004ba5" flood-opacity=".22"/>
    </filter>
  </defs>

  <rect x="88" y="88" width="848" height="848" rx="222" fill="url(#tile)" stroke="url(#tile-edge)" stroke-width="3" filter="url(#tile-shadow)"/>
  <rect x="94" y="94" width="836" height="836" rx="216" fill="none" stroke="#ffffff" stroke-opacity=".76" stroke-width="3"/>

  <circle cx="508" cy="512" r="326" fill="url(#dial)" stroke="url(#dial-edge)" stroke-width="5" filter="url(#dial-shadow)"/>
  <circle cx="508" cy="512" r="321" fill="none" stroke="#b2f0ff" stroke-opacity=".15" stroke-width="3"/>

  <g fill="none" stroke="#9af4ff" stroke-linecap="round" stroke-width="15">
    <path d="M512 228v37"/>
    <path d="m281 664 28-18"/>
    <path d="m712 646 28 18"/>
  </g>

  <g fill="#fcfdff" filter="url(#arrow-shadow)">
    <path d="M585 659c95-47 130-147 84-238-32-64-95-97-164-97-82 0-152 51-194 121" fill="none" stroke="#fcfdff" stroke-width="56" stroke-linecap="round"/>
    <path d="M-14-51q-12-6-12 7v88q0 13 12 7L85 9q15-9 0-18Z" transform="translate(311 445) rotate(121)"/>
  </g>

  <circle cx="585" cy="659" r="22.5" fill="url(#pivot)" stroke="#ec3b15" stroke-opacity=".45" stroke-width="1.5"/>
</svg>
