name: Build and release macOS
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and verify the universal archive
        if: github.ref_type != 'tag'
        run: scripts/package-release.sh dist
      - name: Build the release archive
        if: github.ref_type == 'tag'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: scripts/package-release.sh dist "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tabrewind-macos
          path: |
            dist/*.zip
            dist/*.sha256
            dist/signing-status.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tabrewind-macos
          path: dist
      - name: Verify the archive checksum
        working-directory: dist
        run: sha256sum --check "TabRewind-$GITHUB_REF_NAME-macos-universal.zip.sha256"
      - name: Attest the release archive
        if: github.event.repository.private == false
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.zip
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_REPOSITORY: ${{ github.event.repository.private == false }}
        shell: bash
        run: |
          archive="TabRewind-$GITHUB_REF_NAME-macos-universal.zip"
          cat > release-notes.md <<'NOTES'
          TabRewind switches Safari tabs in most-recently-used order. Tap **Control–Tab** for the previous tab, or hold Control and keep tapping Tab to cycle.

          Download and unzip the universal macOS build for Apple Silicon and Intel. Move **TabRewind.app** to Applications and grant Accessibility permission when prompted. Requires macOS 13 or later.
          NOTES

          if [[ "$(cat dist/signing-status.txt)" == notarized ]]; then
            printf '\nThis build is Developer ID signed and notarized by Apple.\n' >> release-notes.md
          else
            printf '\nThis build is ad hoc signed. Gatekeeper may block the download. [Build locally from source](https://github.com/%s/tree/%s#install) for an alternative.\n' \
              "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> release-notes.md
          fi

          if [[ "$PUBLIC_REPOSITORY" == true ]]; then
            printf '\nVerify the downloaded archive with `gh attestation verify %s --repo %s`.\n' \
              "$archive" "$GITHUB_REPOSITORY" >> release-notes.md
          fi

          gh release create "$GITHUB_REF_NAME" "dist/$archive" "dist/$archive.sha256" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "TabRewind $GITHUB_REF_NAME" \
            --notes-file release-notes.md
